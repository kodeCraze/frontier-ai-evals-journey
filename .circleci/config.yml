version: 2.1

# Fallback CI: GitHub Actions is blocked on this account by a billing lock, so the same checks run
# here. Keep this in sync with .github/workflows/validate.yml.

jobs:
  validate:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Validate data + schema (must exit 0)
          command: python validate.py
      - run:
          name: Smoke-test the evaluation pipeline (mock backend; not real results)
          command: python evaluate.py --backend mock --langs hi

workflows:
  validate:
    jobs:
      - validate
