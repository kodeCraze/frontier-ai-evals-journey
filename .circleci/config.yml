version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install project
          command: python -m pip install -e .
      - run:
          name: Run behavioral tests
          command: python -m unittest discover -s tests -v
      - run:
          name: Reproduce committed evaluation reports
          command: |
            frontier-eval data/support_tickets.jsonl --method keyword --output /tmp/baseline.json
            cmp reports/baseline.json /tmp/baseline.json
            frontier-eval data/support_tickets.jsonl --method tfidf --output /tmp/tfidf-loo.json
            cmp reports/tfidf-loo.json /tmp/tfidf-loo.json
            frontier-eval data/support_tickets.jsonl --compare --output /tmp/comparison.json
            cmp reports/comparison.json /tmp/comparison.json

workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.11", "3.12"]
