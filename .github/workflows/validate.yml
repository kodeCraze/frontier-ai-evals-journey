name: validate

# Enforces AGENTS.md §5 "Validate before you commit": the suite's data and schema must be intact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data + schema (must exit 0)
        run: python validate.py

      - name: Smoke-test the evaluation pipeline (mock backend; not real results)
        run: python evaluate.py --backend mock --langs hi
