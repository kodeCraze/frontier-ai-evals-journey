name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce baseline evaluation
        run: |
          frontier-eval data/support_tickets.jsonl --output "$RUNNER_TEMP/baseline.json"
          cmp reports/baseline.json "$RUNNER_TEMP/baseline.json"

